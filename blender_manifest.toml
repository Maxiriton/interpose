schema_version = "1.0.0"

id = "interpose"
version = "0.1.1"
name = "Interpose"
tagline = "Generate the motion between your key poses with an AI model"
maintainer = "Henri Hebeisen"
type = "add-on"
website = "https://github.com/Maxiriton/interpose"

# https://docs.blender.org/manual/en/dev/advanced/extensions/tags.html
tags = ["Animation", "Rigging"]

blender_version_min = "5.2.0"

# The extension is pure Python: no `platforms`. Generating needs an NVIDIA GPU (see the README); the models are
# installed by the add-on, on request, outside the extension.
license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 Henri Hebeisen",
]

[permissions]
network = "Download the motion models you install, and their weights"
files = "Install the motion models, import and export rig profiles"

# Only the add-on goes into the package: not the tests, spikes or project notes.
# https://docs.blender.org/manual/en/dev/advanced/extensions/command_line_arguments.html#command-line-args-extension-build
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.blend1",
  "/.git",
  "/.git/",
  "/.gitignore",
  "/.gitattributes",
  "/.claude/",
  "/.vscode/",
  "/*.zip",
  "/dist/",
  "/spikes/",
  "/tests/",
  "/CLAUDE.md",
  "/CLAUDE.local.md",
  "/ROADMAP.md",
  "/DESIGN.md",
]
